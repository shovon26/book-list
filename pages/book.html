<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div class="container mt-5">
    <div id="book-details" class="row">
        <div class="col-md-4">
            <img id="book-cover" class="img-fluid rounded" src="" alt="Book cover">
        </div>
        <div class="col-md-8">
            <h1 id="book-title"></h1>
            <h4 id="book-author" class="text-muted"></h4>
            <div class="mt-4">
                <h3>About</h3>
                <p id="book-summary"></p>
            </div>
            <div class="mt-4">
                <h3>Details</h3>
                <ul class="list-unstyled">
                    <li><strong>Genre:</strong> <span id="book-genres"></span></li>
                    <li><strong>Language:</strong> <span id="book-language"></span></li>
                    <li><strong>Download Count:</strong> <span id="book-downloads"></span></li>
                </ul>
            </div>
            <a id="download-link" target="_blank" href="#" class="btn btn-primary mt-3">Download</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/book.js"></script>
</body>
</html>
